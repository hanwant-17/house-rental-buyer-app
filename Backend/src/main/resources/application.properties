# ==========================================
# 🏠 House Rental & Buyer App - Server Config
# ==========================================
server.port=${PORT:8080}

# ==========================================
# 🗄️ MySQL Database Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/house_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Hanwant1705}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 📦 Hibernate / JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 🔐 JWT Security Configuration
# ==========================================
houseapp.jwt.secret=${JWT_SECRET:HouseRentalAppSecretKeyForJwtTokenGeneration2026SecureKeyWithAtLeast256BitsLength!}
houseapp.jwt.expiration-ms=86400000

# ==========================================
# 📁 File Upload Multipart Config (Images & Proofs)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
