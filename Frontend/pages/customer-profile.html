<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - HouseHub</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .profile-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 45px 25px;
        }

        .profile-heading {
            margin-bottom: 30px;
        }

        .profile-heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .profile-heading p {
            color: #667085;
            font-size: 14px;
        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5e7eb;
        }

        .profile-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #eef4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .profile-top h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .profile-top p {
            color: #667085;
            font-size: 14px;
        }

        .profile-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #344054;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .form-group input:disabled {
            background: #f2f4f7;
            color: #667085;
            cursor: not-allowed;
        }

        .save-btn {
            grid-column: 1 / -1;
            border: none;
            background: #2563eb;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .profile-note {
            margin-top: 18px;
            padding: 12px 15px;
            background: #f8fafc;
            border-radius: 8px;
            color: #667085;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .profile-page {
                padding: 30px 18px;
            }

            .profile-card {
                padding: 22px;
            }

            .profile-form {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .save-btn {
                grid-column: auto;
            }

            .profile-top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="dashboard-navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <div class="user-area">
            <span>Customer</span>
            <button id="logoutButton">Logout</button>
        </div>

    </nav>


    <!-- Profile Page -->
    <main class="profile-page">

        <div class="profile-heading">
            <h1>👤 My Profile</h1>

            <p>
                View and update your HouseHub customer information.
            </p>
        </div>


        <div class="profile-card">

            <div class="profile-top">

                <div class="profile-avatar">
                    👤
                </div>

                <div>
                    <h2>Customer Profile</h2>
                    <p>Manage your account information</p>
                </div>

            </div>


            <form id="customerProfileForm" class="profile-form">

                <div class="form-group">

                    <label for="profileName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="profileName"
                        value="Bhavesh"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profileMobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="profileMobile"
                        value="9876543210"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profileEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="profileEmail"
                        value="customer@example.com"
                        disabled
                    >

                </div>


                <div class="form-group">

                    <label for="profileCity">
                        City
                    </label>

                    <input
                        type="text"
                        id="profileCity"
                        value="Jodhpur"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="profilePurpose">
                        Looking To
                    </label>

                    <select id="profilePurpose">

                        <option value="rent">
                            Rent
                        </option>

                        <option value="buy">
                            Buy
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="profileRole">
                        Account Type
                    </label>

                    <input
                        type="text"
                        id="profileRole"
                        value="Customer"
                        disabled
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn">
                    Save Changes
                </button>

            </form>


            <div class="profile-note">
                🔒 Your account information is private and is not shared
                with brokers or other customers.
            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="dashboard-footer">
        <p>© 2026 HouseHub. All Rights Reserved.</p>
    </footer>


    <script src="../js/auth.js"></script>

    <script>
        const profileForm =
            document.getElementById("customerProfileForm");

        if (profileForm) {

            profileForm.addEventListener("submit", function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("profileName").value.trim();

                const mobile =
                    document.getElementById("profileMobile").value.trim();

                const city =
                    document.getElementById("profileCity").value.trim();

                if (name === "") {
                    alert("Please enter your name.");
                    return;
                }

                if (!/^[0-9]{10}$/.test(mobile)) {
                    alert("Please enter a valid 10-digit mobile number.");
                    return;
                }

                if (city === "") {
                    alert("Please enter your city.");
                    return;
                }

                alert("Profile updated successfully.");
            });

        }
    </script>

</body>
</html>
