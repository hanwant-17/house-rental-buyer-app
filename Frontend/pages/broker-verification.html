<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Broker Verification - HouseHub</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .verification-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #667085;
        }

        .broker-card {
            background: #ffffff;
            border: 1px solid #eaecf0;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .broker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .broker-header h2 {
            font-size: 21px;
            margin-bottom: 5px;
        }

        .broker-header p {
            color: #667085;
            font-size: 14px;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            background: #fff7ed;
            color: #c2410c;
            font-size: 13px;
            font-weight: 600;
        }

        .broker-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px 0;
            border-top: 1px solid #eaecf0;
            border-bottom: 1px solid #eaecf0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-item strong {
            font-size: 13px;
            color: #667085;
        }

        .detail-item span {
            font-size: 15px;
            color: #172033;
        }

        .documents {
            margin-top: 20px;
        }

        .documents h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .document-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .document-btn {
            padding: 9px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            background: #ffffff;
            color: #344054;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .document-btn:hover {
            background: #f5f7fb;
        }

        .verification-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .approve-btn,
        .reject-btn {
            border: none;
            padding: 10px 22px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .approve-btn {
            background: #16a34a;
            color: #ffffff;
        }

        .approve-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
            color: #ffffff;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 700px) {

            .verification-container {
                padding: 35px 18px;
            }

            .broker-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .broker-details {
                grid-template-columns: 1fr;
            }

            .verification-actions {
                flex-direction: column;
            }

            .approve-btn,
            .reject-btn {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="dashboard-navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <div class="user-area">

            <span>Welcome, Admin</span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </nav>


    <!-- Broker Verification -->
    <main class="verification-container">

        <a href="admin-dashboard.html" class="back-btn">
            ← Back to Admin Dashboard
        </a>

        <div class="page-header">

            <h1>Broker Verification</h1>

            <p>
                Review broker registration requests and verify their
                submitted information.
            </p>

        </div>


        <!-- Dynamic Broker Requests Container -->
        <div id="brokerRequestsContainer">
            <p style="text-align:center; color:#667085; padding:30px;">Loading pending broker requests...</p>
        </div>

    </main>


    <!-- Footer -->
    <footer class="dashboard-footer">

        <p>
            © 2026 HouseHub. All Rights Reserved.
        </p>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        // Check Admin Auth Guard
        const user = window.api ? window.api.getCurrentUser() : null;
        if (!user || user.role !== "ADMIN") {
            alert("Access restricted: Please login as Admin.");
            window.location.href = "login.html";
        }

        const container = document.getElementById("brokerRequestsContainer");

        async function loadPendingBrokers() {
            try {
                container.innerHTML = '<p style="text-align:center; color:#667085; padding:30px;">Loading pending broker requests...</p>';
                const response = await window.api.getPendingBrokers();
                const brokers = response.data || [];

                if (brokers.length === 0) {
                    container.innerHTML = `
                        <div class="broker-card" style="text-align:center; padding:40px;">
                            <div style="font-size:40px; margin-bottom:10px;">✅</div>
                            <h2>No Pending Requests</h2>
                            <p style="color:#667085; margin-top:5px;">All broker registrations have been reviewed and verified!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                brokers.forEach(broker => {
                    const u = broker.user || {};
                    const card = document.createElement("div");
                    card.className = "broker-card";
                    card.innerHTML = `
                        <div class="broker-header">
                            <div>
                                <h2>${u.name || "Broker Application"}</h2>
                                <p>Broker Registration Request (Application ID: #${broker.brokerId})</p>
                            </div>
                            <span class="status">Pending Verification</span>
                        </div>

                        <div class="broker-details">
                            <div class="detail-item">
                                <strong>Mobile Number</strong>
                                <span>${u.mobile || "N/A"}</span>
                            </div>
                            <div class="detail-item">
                                <strong>Email Address</strong>
                                <span>${u.email || "N/A"}</span>
                            </div>
                            <div class="detail-item">
                                <strong>Agency / Company</strong>
                                <span>${broker.agencyName || "Independent"}</span>
                            </div>
                            <div class="detail-item">
                                <strong>City</strong>
                                <span>${broker.city || "N/A"}</span>
                            </div>
                            <div class="detail-item">
                                <strong>Experience</strong>
                                <span>${broker.experience || "N/A"}</span>
                            </div>
                            <div class="detail-item">
                                <strong>Applied Date</strong>
                                <span>${broker.createdAt ? new Date(broker.createdAt).toLocaleDateString() : "Recent"}</span>
                            </div>
                        </div>

                        <div class="documents">
                            <h3>Submitted KYC Documents</h3>
                            <div class="document-list">
                                <a href="${broker.idProofUrl || '#'}" target="_blank" class="document-btn">
                                    📄 View ID Proof
                                </a>
                                <a href="${broker.addressProofUrl || '#'}" target="_blank" class="document-btn">
                                    📄 View Address Proof
                                </a>
                            </div>
                        </div>

                        <div class="verification-actions">
                            <button class="approve-btn" onclick="handleApprove(${broker.brokerId}, '${u.name || "Broker"}')">
                                ✓ Approve & Assign Broker ID
                            </button>
                            <button class="reject-btn" onclick="handleReject(${broker.brokerId}, '${u.name || "Broker"}')">
                                ✕ Reject
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `
                    <div class="broker-card" style="text-align:center; padding:30px; color:#b91c1c;">
                        <p>Failed to load pending brokers: ${err.message}</p>
                        <button onclick="loadPendingBrokers()" style="margin-top:10px; padding:6px 12px; cursor:pointer;">Retry</button>
                    </div>
                `;
            }
        }

        async function handleApprove(brokerId, name) {
            if (!confirm(`Are you sure you want to approve ${name} and generate an official Broker ID?`)) return;

            try {
                const response = await window.api.approveBroker(brokerId);
                const assignedCode = response.data && response.data.brokerCode ? response.data.brokerCode : "Generated";
                alert(`✅ Success! ${name} has been approved.\nOfficial Broker ID assigned: ${assignedCode}`);
                loadPendingBrokers();
            } catch (error) {
                alert("Approval failed: " + error.message);
            }
        }

        async function handleReject(brokerId, name) {
            const reason = prompt(`Enter reason for rejecting ${name}:`, "Documents could not be verified.");
            if (!reason) return;

            try {
                await window.api.rejectBroker(brokerId, reason);
                alert(`✕ ${name} application has been rejected.`);
                loadPendingBrokers();
            } catch (error) {
                alert("Rejection failed: " + error.message);
            }
        }

        // Initialize on load
        document.addEventListener("DOMContentLoaded", loadPendingBrokers);
    </script>
</body>
</html>
