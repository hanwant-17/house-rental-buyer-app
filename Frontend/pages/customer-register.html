<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration - HouseHub</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="properties.html">Buy</a></li>
            <li><a href="properties.html">Rent</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>


    <!-- REGISTRATION -->

    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-header">

                <h1>Create Account</h1>

                <p>
                    Register as a Customer / Tenant
                </p>

            </div>


            <form id="customerRegisterForm">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- CITY -->

                <div class="form-group">

                    <label for="city">
                        City <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- USER TYPE -->

                <div class="form-group">

                    <label for="userType">
                        I am looking to <span>*</span>
                    </label>

                    <select id="userType" name="userType" required>

                        <option value="">
                            Select purpose
                        </option>

                        <option value="rent">
                            Rent a Property
                        </option>

                        <option value="buy">
                            Buy a Property
                        </option>

                    </select>

                    <small class="error-message"></small>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Create Account

                </button>


                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 HouseHub. All Rights Reserved.
        </p>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
