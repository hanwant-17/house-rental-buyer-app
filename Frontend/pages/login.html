<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HouseHub Portal</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475467;
            --slate-500: #64748b;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= NAVBAR ================= */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--slate-200);
            padding: 0 5%;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--slate-900);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
            list-style: none;
        }

        .nav-links a {
            color: var(--slate-600);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        /* ================= AUTH CONTAINER ================= */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 60%);
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--slate-200);
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 38px 34px;
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #bfdbfe;
        }

        .auth-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--slate-900);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .auth-header p {
            color: var(--slate-500);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--slate-700);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 15px;
            color: var(--slate-400);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 40px;
            border: 1px solid var(--slate-300);
            border-radius: 10px;
            font-size: 14px;
            color: var(--slate-800);
            background: #ffffff;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--slate-400);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }

        .toggle-password-btn:hover {
            color: var(--slate-600);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
            display: block;
            min-height: 16px;
        }

        .btn-auth-submit {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-auth-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .auth-divider {
            text-align: center;
            margin: 24px 0 18px;
            position: relative;
        }

        .auth-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--slate-200);
        }

        .auth-divider span {
            background: #ffffff;
            padding: 0 12px;
            font-size: 12.5px;
            color: var(--slate-500);
            position: relative;
            z-index: 1;
            font-weight: 600;
        }

        .register-links-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .reg-role-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }

        .reg-customer {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .reg-customer:hover {
            background: #dbeafe;
        }

        .reg-broker {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .reg-broker:hover {
            background: #d1fae5;
        }

        /* ================= FOOTER ================= */
        .footer {
            background: #ffffff;
            border-top: 1px solid var(--slate-200);
            padding: 20px;
            text-align: center;
            color: var(--slate-500);
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .navbar .nav-links {
                display: none;
            }
            .auth-card {
                padding: 28px 22px;
            }
            .register-links-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="../index.html" class="logo">
            🏠 House<span>Hub</span>
        </a>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="properties.html">Browse Listings</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </header>

    <!-- AUTH SECTION -->
    <main class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-header">
                <span class="auth-badge">🛡️ Secure Account Access</span>
                <h1>Welcome Back</h1>
                <p>Sign in to your Customer, Broker, or Admin portal</p>
            </div>

            <!-- AUTOCOMPLETE COMPLETELY OFF TO PREVENT LINGERING IDS/PASSWORDS -->
            <form id="loginForm" autocomplete="off" onsubmit="return false;">

                <!-- FAKE INPUT TO ABSORB BROWSER AUTOFILL IF ANY -->
                <input type="text" style="display:none;" tabindex="-1">
                <input type="password" style="display:none;" tabindex="-1">

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">✉️</span>
                        <input
                            type="email"
                            id="loginEmail"
                            name="user_login_email"
                            placeholder="name@example.com"
                            autocomplete="off"
                            readonly
                            onfocus="this.removeAttribute('readonly');"
                            required
                        >
                    </div>
                    <small class="error-message"></small>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="loginPassword"
                            name="user_login_password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            readonly
                            onfocus="this.removeAttribute('readonly');"
                            required
                        >
                        <button type="button" class="toggle-password-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                            👁️
                        </button>
                    </div>
                    <small class="error-message"></small>
                </div>

                <button
                    type="submit"
                    class="btn-auth-submit"
                    id="loginSubmitBtn">
                    Sign In to Portal →
                </button>

                <div class="auth-divider">
                    <span>Don't have an account?</span>
                </div>

                <div class="register-links-row">
                    <a href="customer-register.html" class="reg-role-btn reg-customer">
                        👤 Customer Register
                    </a>
                    <a href="broker-register.html" class="reg-role-btn reg-broker">
                        🏢 Broker Register
                    </a>
                </div>

            </form>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 HouseHub Real Estate Platform. All Rights Reserved.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        // Password Visibility Toggle
        function togglePasswordVisibility() {
            const passInput = document.getElementById("loginPassword");
            const btn = document.getElementById("togglePasswordBtn");
            if (passInput) {
                if (passInput.type === "password") {
                    passInput.type = "text";
                    btn.textContent = "🙈";
                } else {
                    passInput.type = "password";
                    btn.textContent = "👁️";
                }
            }
        }

        // FORCEFUL CLEAR OF ID & PASSWORD ON LOAD & LOGOUT REDIRECT
        function purgeLoginCredentials() {
            const form = document.getElementById("loginForm");
            if (form) form.reset();
            const email = document.getElementById("loginEmail");
            const pass = document.getElementById("loginPassword");
            if (email) email.value = "";
            if (pass) pass.value = "";
        }

        window.addEventListener("pageshow", purgeLoginCredentials);
        document.addEventListener("DOMContentLoaded", function () {
            purgeLoginCredentials();
            setTimeout(purgeLoginCredentials, 50);
            setTimeout(purgeLoginCredentials, 150);
            setTimeout(purgeLoginCredentials, 400);

            // Re-bind form submit button if auth.js listener needs trigger
            const form = document.getElementById("loginForm");
            if (form) {
                form.onsubmit = null; // Let auth.js event listener handle it
            }
        });
    </script>

</body>

</html>
