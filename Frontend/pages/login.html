<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HouseHub</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <ul class="nav-links">
            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="properties.html">Buy</a>
            </li>

            <li>
                <a href="properties.html">Rent</a>
            </li>

            <li>
                <a href="customer-register.html">
                    Register
                </a>
            </li>
        </ul>

    </nav>


    <!-- LOGIN SECTION -->

    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to your HouseHub account
                </p>

            </div>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="loginRole">
                        Login As <span>*</span>
                    </label>

                    <select
                        id="loginRole"
                        name="role"
                        required
                    >

                        <option value="">
                            Select role
                        </option>

                        <option value="customer">
                            Customer / Tenant
                        </option>

                        <option value="broker">
                            Broker / Owner
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                    <small class="error-message"></small>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>


                <p class="auth-footer">

                    Don't have an account?

                    <a href="customer-register.html">
                        Create Account
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 HouseHub. All Rights Reserved.
        </p>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
