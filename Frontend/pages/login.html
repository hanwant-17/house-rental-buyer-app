<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - HouseHub</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <ul class="nav-links">
            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="properties.html?purpose=BUY">Buy</a>
            </li>

            <li>
                <a href="properties.html?purpose=RENT">Rent</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

            <li>
                <a href="customer-register.html">
                    Register
                </a>
            </li>
        </ul>

    </nav>


    <!-- LOGIN SECTION -->

    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to your HouseHub account
                </p>

            </div>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="loginRole">
                        Login As <span>*</span>
                    </label>

                    <select
                        id="loginRole"
                        name="role"
                        required
                    >

                        <option value="">
                            Select role
                        </option>

                        <option value="customer">
                            Customer / Tenant
                        </option>

                        <option value="broker">
                            Broker / Owner
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                    <small class="error-message"></small>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>


                <div style="margin-top:22px; text-align:center;">
                    <p style="color:#64748b; font-size:13px; margin-bottom:12px; font-weight:500;">
                        Don't have an account? Register below:
                    </p>
                    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                        <a href="customer-register.html" style="display:inline-flex; align-items:center; gap:6px; padding:9px 16px; background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; border-radius:8px; text-decoration:none; font-size:13px; font-weight:600; transition:all 0.2s;">
                            <span>👤</span> Customer / Tenant
                        </a>
                        <a href="broker-register.html" style="display:inline-flex; align-items:center; gap:6px; padding:9px 16px; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; border-radius:8px; text-decoration:none; font-size:13px; font-weight:600; transition:all 0.2s;">
                            <span>🏢</span> Broker / Owner
                        </a>
                    </div>
                </div>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 HouseHub. All Rights Reserved.
        </p>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
