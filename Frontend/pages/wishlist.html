<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist - HouseHub</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .wishlist-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 45px 25px;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #667085;
            font-size: 14px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .wishlist-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .wishlist-image {
            height: 200px;
            position: relative;
        }

        .wishlist-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            color: #dc2626;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .remove-btn:hover {
            background: #fef2f2;
        }

        .wishlist-content {
            padding: 20px;
        }

        .wishlist-content h3 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .location {
            color: #667085;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .property-info {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .property-info span {
            color: #475467;
            font-size: 13px;
        }

        .price {
            color: #1d4ed8;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .view-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        .empty-wishlist {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-wishlist .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-wishlist h2 {
            margin-bottom: 8px;
        }

        .empty-wishlist p {
            color: #667085;
            margin-bottom: 20px;
        }

        .browse-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 950px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .wishlist-page {
                padding: 30px 18px;
            }

            .wishlist-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="dashboard-navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <div class="user-area">
            <span>Customer</span>
            <button id="logoutButton">Logout</button>
        </div>

    </nav>


    <!-- Main Content -->
    <main class="wishlist-page">

        <div class="page-heading">

            <h1>❤️ My Wishlist</h1>

            <p>
                Properties you have saved for later.
            </p>

        </div>


        <div class="wishlist-grid" id="wishlistContainer">
            <p style="grid-column: 1 / -1; text-align: center; color: #667085; padding: 40px;">
                Loading your saved properties...
            </p>
        </div>

    </main>


    <!-- Footer -->
    <footer class="dashboard-footer">
        <p>© 2026 HouseHub. All Rights Reserved.</p>
    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        const user = window.api ? window.api.getCurrentUser() : null;
        if (!user || user.role !== "CUSTOMER") {
            alert("Please login as a Customer to view your wishlist.");
            window.location.href = "login.html";
        } else {
            const userArea = document.querySelector(".user-area span");
            if (userArea) {
                userArea.textContent = `Welcome, ${user.name || "Customer"}`;
            }
        }

        const container = document.getElementById("wishlistContainer");

        async function loadWishlist() {
            try {
                const response = await window.api.getWishlist();
                const items = response.data || [];

                if (items.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align:center; padding:50px; background:#fff; border-radius:14px; border:1px solid #e5e7eb;">
                            <div style="font-size:40px; margin-bottom:10px;">❤️</div>
                            <h3>Your wishlist is empty</h3>
                            <p style="color:#667085; margin:10px 0 20px;">Explore verified properties and save your favorites here.</p>
                            <a href="properties.html" class="view-btn" style="display:inline-block;">Explore Properties</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                items.forEach(item => {
                    const prop = item.property || {};
                    const primaryImg = (prop.images && prop.images.length > 0) ? prop.images[0].imageUrl : "../images/flat-banner.jpg";
                    const priceFormatted = Number(prop.price).toLocaleString();

                    const card = document.createElement("div");
                    card.className = "wishlist-card";
                    card.innerHTML = `
                        <div class="wishlist-image">
                            <img src="${primaryImg}" alt="${prop.title}">
                            <button class="remove-btn" onclick="handleRemoveWishlist(${prop.propertyId})">
                                ♥
                            </button>
                        </div>

                        <div class="wishlist-content">
                            <h3>${prop.title}</h3>
                            <p class="location">📍 ${prop.city}, ${prop.address}</p>

                            <div class="property-info">
                                <span>🛏 ${prop.bhk} BHK</span>
                                <span>🚿 ${prop.bathrooms || 1} Baths</span>
                                <span>📐 ${prop.areaSqft || 1000} sq.ft</span>
                            </div>

                            <div class="price">
                                ₹${priceFormatted} ${prop.purpose === 'RENT' ? '/ month' : ''}
                            </div>

                            <button onclick="viewPropDetails(${prop.propertyId})" class="view-btn" style="width:100%; border:none; cursor:pointer;">
                                View Details
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<p style="grid-column: 1 / -1; text-align:center; color:#b91c1c; padding:30px;">Error loading wishlist: ${err.message}</p>`;
            }
        }

        async function handleRemoveWishlist(propertyId) {
            if (!confirm("Remove this property from your wishlist?")) return;

            try {
                await window.api.removeFromWishlist(propertyId);
                loadWishlist();
            } catch (e) {
                alert("Failed to remove item: " + e.message);
            }
        }

        function viewPropDetails(id) {
            localStorage.setItem("selectedPropertyId", id);
            window.location.href = "property-details.html";
        }

        document.addEventListener("DOMContentLoaded", loadWishlist);
    </script>
</body>
</html>
