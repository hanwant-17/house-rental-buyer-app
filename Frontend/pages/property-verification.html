<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Verification - HouseHub</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .verification-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 25px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #667085;
            font-size: 15px;
        }

        .property-card {
            background: #ffffff;
            border: 1px solid #eaecf0;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .property-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .property-header h2 {
            font-size: 21px;
            margin-bottom: 6px;
        }

        .property-header p {
            color: #667085;
            font-size: 14px;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            background: #fff7ed;
            color: #c2410c;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .property-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            padding: 20px 0;
            border-top: 1px solid #eaecf0;
            border-bottom: 1px solid #eaecf0;
        }

        .property-image {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
        }

        .property-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .property-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-item strong {
            color: #667085;
            font-size: 13px;
        }

        .detail-item span {
            color: #172033;
            font-size: 15px;
        }

        .property-price {
            color: #1d4ed8 !important;
            font-size: 17px !important;
            font-weight: 700;
        }

        .documents {
            margin-top: 20px;
        }

        .documents h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .document-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .document-btn {
            padding: 9px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            background: #ffffff;
            color: #344054;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .document-btn:hover {
            background: #f5f7fb;
        }

        .verification-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .approve-btn,
        .reject-btn {
            border: none;
            padding: 10px 22px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .approve-btn {
            background: #16a34a;
            color: #ffffff;
        }

        .approve-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
            color: #ffffff;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        @media (max-width: 800px) {

            .property-content {
                grid-template-columns: 1fr;
            }

            .property-image {
                height: 250px;
            }
        }

        @media (max-width: 600px) {

            .verification-container {
                padding: 35px 18px;
            }

            .property-header {
                flex-direction: column;
            }

            .property-details {
                grid-template-columns: 1fr;
            }

            .verification-actions {
                flex-direction: column;
            }

            .approve-btn,
            .reject-btn {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="dashboard-navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <div class="user-area">

            <span>Welcome, Admin</span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="verification-container">

        <a href="admin-dashboard.html" class="back-btn">
            ← Back to Admin Dashboard
        </a>


        <div class="page-header">

            <h1>Property Verification</h1>

            <p>
                Review property details and documents submitted by
                brokers before publishing the property.
            </p>

        </div>


        <!-- Dynamic Property Requests Container -->
        <div id="propertyRequestsContainer">
            <p style="text-align:center; color:#667085; padding:30px;">Loading pending properties...</p>
        </div>

    </main>


    <!-- Footer -->
    <footer class="dashboard-footer">

        <p>
            © 2026 HouseHub. All Rights Reserved.
        </p>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        // Check Admin Auth Guard
        const user = window.api ? window.api.getCurrentUser() : null;
        if (!user || user.role !== "ADMIN") {
            alert("Access restricted: Please login as Admin.");
            window.location.href = "login.html";
        }

        const container = document.getElementById("propertyRequestsContainer");

        async function loadPendingProperties() {
            try {
                container.innerHTML = '<p style="text-align:center; color:#667085; padding:30px;">Loading pending property listings...</p>';
                const response = await window.api.getPendingProperties();
                const properties = response.data || [];

                if (properties.length === 0) {
                    container.innerHTML = `
                        <div class="property-card" style="text-align:center; padding:40px;">
                            <div style="font-size:40px; margin-bottom:10px;">🏠</div>
                            <h2>No Pending Properties</h2>
                            <p style="color:#667085; margin-top:5px;">All submitted properties have been reviewed and published!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                properties.forEach(prop => {
                    const brokerUser = (prop.broker && prop.broker.user) ? prop.broker.user : {};
                    const primaryImg = (prop.images && prop.images.length > 0) ? prop.images[0].imageUrl : "../images/home-banner.jpg";

                    const card = document.createElement("div");
                    card.className = "property-card";
                    card.innerHTML = `
                        <div class="property-header">
                            <div>
                                <h2>${prop.title}</h2>
                                <p>Submitted by: <strong>${brokerUser.name || "Broker"}</strong> (${prop.broker.brokerCode || "Verified Broker"})</p>
                            </div>
                            <span class="status">Pending Verification</span>
                        </div>

                        <div class="property-content">
                            <div class="property-image">
                                <img src="${primaryImg}" alt="${prop.title}">
                            </div>

                            <div class="property-details">
                                <div class="detail-item">
                                    <strong>Property Type</strong>
                                    <span>${prop.propertyType || "Apartment"}</span>
                                </div>
                                <div class="detail-item">
                                    <strong>Purpose</strong>
                                    <span>For ${prop.purpose || "Rent"}</span>
                                </div>
                                <div class="detail-item">
                                    <strong>City & Address</strong>
                                    <span>${prop.city}, ${prop.address}</span>
                                </div>
                                <div class="detail-item">
                                    <strong>BHK</strong>
                                    <span>${prop.bhk} BHK (${prop.bathrooms || 1} Baths)</span>
                                </div>
                                <div class="detail-item">
                                    <strong>Area</strong>
                                    <span>${prop.areaSqft || "N/A"} sq.ft</span>
                                </div>
                                <div class="detail-item">
                                    <strong>Furnished Status</strong>
                                    <span>${prop.furnishedStatus || "Unfurnished"}</span>
                                </div>
                                <div class="detail-item">
                                    <strong>Parking</strong>
                                    <span>${prop.parking ? "Available" : "Not Available"}</span>
                                </div>
                                <div class="detail-item">
                                    <strong>Price / Rent</strong>
                                    <span class="property-price">₹${Number(prop.price).toLocaleString()} ${prop.purpose === 'RENT' ? '/ month' : ''}</span>
                                </div>
                            </div>
                        </div>

                        <div class="documents">
                            <h3>Amenities & Description</h3>
                            <p style="font-size:14px; color:#475467; margin-bottom:10px;">${prop.description || "No description provided."}</p>
                            <small style="color:#667085;">Amenities: ${prop.amenities || "None"}</small>
                        </div>

                        <div class="verification-actions">
                            <button class="approve-btn" onclick="handleApproveProperty(${prop.propertyId}, '${prop.title}')">
                                ✓ Approve & Make LIVE
                            </button>
                            <button class="reject-btn" onclick="handleRejectProperty(${prop.propertyId}, '${prop.title}')">
                                ✕ Reject
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `
                    <div class="property-card" style="text-align:center; padding:30px; color:#b91c1c;">
                        <p>Failed to load pending properties: ${err.message}</p>
                        <button onclick="loadPendingProperties()" style="margin-top:10px; padding:6px 12px; cursor:pointer;">Retry</button>
                    </div>
                `;
            }
        }

        async function handleApproveProperty(propertyId, title) {
            if (!confirm(`Are you sure you want to approve "${title}"? It will become visible to all customers immediately.`)) return;

            try {
                await window.api.approveProperty(propertyId);
                alert(`✅ Success! "${title}" has been approved and is now LIVE for customers!`);
                loadPendingProperties();
            } catch (error) {
                alert("Approval failed: " + error.message);
            }
        }

        async function handleRejectProperty(propertyId, title) {
            const reason = prompt(`Enter reason for rejecting "${title}":`, "Property details or price mismatch.");
            if (!reason) return;

            try {
                await window.api.rejectProperty(propertyId, reason);
                alert(`✕ "${title}" has been rejected.`);
                loadPendingProperties();
            } catch (error) {
                alert("Rejection failed: " + error.message);
            }
        }

        document.addEventListener("DOMContentLoaded", loadPendingProperties);
    </script>
</body>
</html>
