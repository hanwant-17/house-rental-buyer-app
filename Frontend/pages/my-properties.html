<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Properties - HouseHub</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .properties-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 45px 25px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #667085;
            font-size: 14px;
        }

        .add-property-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .add-property-btn:hover {
            background: #1d4ed8;
        }

        .property-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .my-property-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .property-image {
            width: 100%;
            height: 190px;
            overflow: hidden;
        }

        .property-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .property-content {
            padding: 20px;
        }

        .property-content h3 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .property-location {
            color: #667085;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .property-info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .property-info span {
            font-size: 13px;
            color: #475467;
        }

        .property-price {
            color: #1d4ed8;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .approved {
            background: #ecfdf3;
            color: #15803d;
        }

        .rejected {
            background: #fef2f2;
            color: #dc2626;
        }

        .property-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .view-btn,
        .edit-btn {
            padding: 9px 14px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .view-btn {
            background: #eef4ff;
            color: #1d4ed8;
        }

        .edit-btn {
            background: #f2f4f7;
            color: #344054;
        }

        .empty-message {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            color: #667085;
        }

        @media (max-width: 950px) {
            .property-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .properties-page {
                padding: 30px 18px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }

            .property-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="dashboard-navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <div class="user-area">
            <span>Broker</span>
            <button id="logoutButton">Logout</button>
        </div>

    </nav>


    <!-- Main Content -->
    <main class="properties-page">

        <div class="page-header">

            <div>
                <h1>My Properties</h1>
                <p>Manage your submitted properties and verification status.</p>
            </div>

            <a href="add-property.html" class="add-property-btn">
                + Add Property
            </a>

        </div>


        <!-- Property List -->
        <div class="property-list" id="myPropertiesContainer">
            <p style="grid-column: 1 / -1; text-align: center; color: #667085; padding: 40px;">
                Loading your listed properties...
            </p>
        </div>

    </main>


    <!-- Footer -->
    <footer class="dashboard-footer">
        <p>© 2026 HouseHub. All Rights Reserved.</p>
    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        const user = window.api ? window.api.getCurrentUser() : null;
        if (!user || user.role !== "BROKER") {
            alert("Please login as a Broker to view your properties.");
            window.location.href = "login.html";
        } else {
            const userArea = document.querySelector(".user-area span");
            if (userArea) {
                userArea.textContent = `Welcome, ${user.name || "Broker"}`;
            }
        }

        const container = document.getElementById("myPropertiesContainer");

        async function loadMyProperties() {
            try {
                const response = await window.api.getMyProperties();
                const list = response.data || [];

                if (list.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align:center; padding:50px; background:#fff; border-radius:14px; border:1px solid #e5e7eb;">
                            <div style="font-size:40px; margin-bottom:10px;">🏠</div>
                            <h3>No properties added yet</h3>
                            <p style="color:#667085; margin:8px 0 20px;">Add your first property listing to send it for Admin verification.</p>
                            <a href="add-property.html" class="add-property-btn">+ Add New Property</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                list.forEach(prop => {
                    const vStatus = prop.verificationStatus || "PENDING";
                    let statusClass = "pending";
                    let statusLabel = "Pending Verification";

                    if (vStatus === "APPROVED") {
                        statusClass = "approved";
                        statusLabel = "Approved & Live";
                    } else if (vStatus === "REJECTED") {
                        statusClass = "rejected";
                        statusLabel = "Rejected";
                    }

                    const primaryImg = (prop.images && prop.images.length > 0) ? prop.images[0].imageUrl : "../images/flat-banner.jpg";
                    const priceFormatted = Number(prop.price).toLocaleString();

                    const card = document.createElement("div");
                    card.className = "my-property-card";
                    card.innerHTML = `
                        <div class="property-image">
                            <img src="${primaryImg}" alt="${prop.title}">
                        </div>

                        <div class="property-content">
                            <h3>${prop.title}</h3>
                            <p class="property-location">📍 ${prop.city}, ${prop.address}</p>

                            <div class="property-info">
                                <span>🛏 ${prop.bhk} BHK</span>
                                <span>🚿 ${prop.bathrooms || 1} Baths</span>
                                <span>📐 ${prop.areaSqft || 1000} sq.ft</span>
                            </div>

                            <div class="property-price">
                                ₹${priceFormatted} ${prop.purpose === 'RENT' ? '/ month' : ''}
                            </div>

                            <span class="status ${statusClass}">
                                ${statusLabel}
                            </span>

                            <div class="property-actions">
                                <button onclick="viewPropDetails(${prop.propertyId})" class="view-btn" style="border:none; cursor:pointer;">
                                    View
                                </button>
                                <a href="property-status.html" class="edit-btn">
                                    Status (${prop.propertyStatus || 'AVAILABLE'})
                                </a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align:center; padding:40px; color:#b91c1c;">
                        <p>Error loading your properties: ${err.message}</p>
                    </div>
                `;
            }
        }

        function viewPropDetails(id) {
            localStorage.setItem("selectedPropertyId", id);
            window.location.href = "property-details.html";
        }

        document.addEventListener("DOMContentLoaded", loadMyProperties);
    </script>
</body>
</html>
