<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details - HouseHub</title>

    <link rel="stylesheet" href="../css/property.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <ul class="nav-links" id="detailsNavLinks">
            <li><a href="../index.html">Home</a></li>
            <li><a href="properties.html?purpose=BUY">Buy</a></li>
            <li><a href="properties.html?purpose=RENT">Rent</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="customer-register.html">Register</a></li>
        </ul>

    </nav>


    <!-- PROPERTY DETAILS -->

    <section class="property-details-section">

        <div id="propertyDetails">

            <!-- Property details will come from JavaScript -->

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-container">

            <div>
                <h3>🏠 HouseHub</h3>

                <p>
                    Find your perfect home for rent or purchase.
                </p>
            </div>


            <div>
                <h4>Quick Links</h4>

                <a href="../index.html">Home</a>
                <a href="properties.html">Properties</a>
                <a href="login.html">Login</a>
            </div>


            <div>
                <h4>For Users</h4>

                <a href="customer-register.html">
                    Customer Registration
                </a>

                <a href="broker-register.html">
                    Broker Registration
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 HouseHub. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/property.js"></script>

    <script>
        function updateDetailsNav() {
            const user = window.api ? window.api.getCurrentUser() : null;
            const nav = document.getElementById("detailsNavLinks");
            if (user && user.token && nav) {
                let dashUrl = "customer-dashboard.html";
                if (user.role === "BROKER") dashUrl = "broker-dashboard.html";
                else if (user.role === "ADMIN") dashUrl = "admin-dashboard.html";

                nav.innerHTML = `
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="properties.html">Properties</a></li>
                    <li><a href="${dashUrl}" style="background:#2563eb; color:#fff; padding:6px 14px; border-radius:6px; font-weight:600; text-decoration:none;">Dashboard</a></li>
                    <li><a href="#" id="navLogoutBtn" style="color:#dc2626; font-weight:600; text-decoration:none;">Logout</a></li>
                `;

                document.getElementById("navLogoutBtn")?.addEventListener("click", function(e) {
                    e.preventDefault();
                    window.api.clearAuth();
                    window.location.href = "login.html";
                });
            }
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", updateDetailsNav);
        } else {
            updateDetailsNav();
        }
    </script>

</body>

</html>
