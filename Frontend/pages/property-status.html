<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Status - HouseHub</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <style>
        .status-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 25px;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #667085;
            font-size: 14px;
        }

        .status-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .property-top {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .property-image {
            width: 190px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
        }

        .property-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .property-info h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .location {
            color: #667085;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .details {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            color: #475467;
            font-size: 13px;
        }

        .status-section {
            border-top: 1px solid #e5e7eb;
            margin-top: 22px;
            padding-top: 20px;
        }

        .status-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .approved {
            background: #ecfdf3;
            color: #15803d;
        }

        .rejected {
            background: #fef2f2;
            color: #dc2626;
        }

        .submitted-date {
            color: #667085;
            font-size: 13px;
            margin-top: 10px;
        }

        .back-button {
            display: inline-block;
            margin-top: 10px;
            background: #f2f4f7;
            color: #344054;
            text-decoration: none;
            padding: 10px 17px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .back-button:hover {
            background: #e4e7ec;
        }

        @media (max-width: 650px) {
            .status-page {
                padding: 30px 18px;
            }

            .property-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .property-image {
                width: 100%;
                height: 200px;
            }

            .details {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="dashboard-navbar">

        <div class="logo">
            🏠 HouseHub
        </div>

        <div class="user-area">
            <span>Broker</span>
            <button id="logoutButton">Logout</button>
        </div>

    </nav>


    <!-- Main Content -->
    <main class="status-page">

        <div class="page-heading">
            <h1>Property Verification Status</h1>

            <p>
                Track the verification status of your submitted properties.
            </p>
        </div>


        <div id="statusCardsContainer">
            <p style="text-align: center; color: #667085; padding: 40px;">Loading your property statuses...</p>
        </div>

        <a href="broker-dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>

    </main>


    <!-- Footer -->
    <footer class="dashboard-footer">
        <p>© 2026 HouseHub. All Rights Reserved.</p>
    </footer>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        const user = window.api ? window.api.getCurrentUser() : null;
        if (!user || user.role !== "BROKER") {
            alert("Please login as a Broker.");
            window.location.href = "login.html";
        } else {
            const userArea = document.querySelector(".user-area span");
            if (userArea) {
                userArea.textContent = `Welcome, ${user.name || "Broker"}`;
            }
        }

        const container = document.getElementById("statusCardsContainer");

        async function loadPropertyStatusList() {
            try {
                const response = await window.api.getMyProperties();
                const properties = response.data || [];

                if (properties.length === 0) {
                    container.innerHTML = `
                        <div class="status-card" style="text-align:center; padding:40px;">
                            <div style="font-size:36px; margin-bottom:10px;">📋</div>
                            <h3>No properties submitted yet</h3>
                            <p style="color:#667085; margin:10px 0 20px;">Submit a property to track its Admin verification status.</p>
                            <a href="add-property.html" class="back-button" style="display:inline-block;">+ Add Property</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                properties.forEach(prop => {
                    const vStatus = prop.verificationStatus || "PENDING";
                    const pStatus = prop.propertyStatus || "AVAILABLE";

                    let badgeClass = "pending";
                    let badgeIcon = "🟡";
                    let statusDesc = "Pending Admin Verification. Details are currently being audited.";

                    if (vStatus === "APPROVED") {
                        badgeClass = "approved";
                        badgeIcon = "🟢";
                        statusDesc = `Approved by Admin! Currently ${pStatus}. Visible in customer search.`;
                    } else if (vStatus === "REJECTED") {
                        badgeClass = "rejected";
                        badgeIcon = "🔴";
                        statusDesc = `Rejected: ${prop.rejectionReason || "Please verify pricing and documents."}`;
                    }

                    const primaryImg = (prop.images && prop.images.length > 0) ? prop.images[0].imageUrl : "../images/flat-banner.jpg";

                    const card = document.createElement("div");
                    card.className = "status-card";
                    card.innerHTML = `
                        <div class="property-top">
                            <div class="property-image">
                                <img src="${primaryImg}" alt="${prop.title}">
                            </div>

                            <div class="property-info">
                                <h2>${prop.title}</h2>
                                <p class="location">📍 ${prop.city}, ${prop.address}</p>
                                <div class="details">
                                    <span>🛏 ${prop.bhk} BHK</span>
                                    <span>🚿 ${prop.bathrooms || 1} Baths</span>
                                    <span>📐 ${prop.areaSqft || 1000} sq.ft</span>
                                    <span>💰 ₹${Number(prop.price).toLocaleString()} ${prop.purpose === 'RENT' ? '/ month' : ''}</span>
                                </div>
                            </div>
                        </div>

                        <div class="status-section" style="margin-top:20px; border-top:1px solid #f1f5f9; padding-top:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                            <div>
                                <div class="status-title" style="font-weight:700; color:#1e293b; margin-bottom:6px;">Verification Status (Rule 2)</div>
                                <span class="status-badge ${badgeClass}" style="display:inline-block; font-size:13px; font-weight:700; padding:6px 14px;">
                                    ${badgeIcon} ${vStatus}
                                </span>
                                <p class="submitted-date" style="margin-top:8px; font-size:13px; color:#475467;">
                                    ${statusDesc}
                                </p>
                            </div>

                            <div>
                                <a href="my-properties.html" style="display:inline-block; background:#eff6ff; color:#2563eb; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; border:1px solid #bfdbfe;">
                                    Manage in My Properties →
                                </a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<p style="text-align:center; color:#b91c1c; padding:30px;">Error loading status: ${err.message}</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadPropertyStatusList);
    </script>
</body>
</html>
